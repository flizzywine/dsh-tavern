# 公网预览 Profile：加载真实 DSH Tavern UI，但不连接真实模型或开放本地工具。
- id: webserver
  config:
    host: 0.0.0.0
    port: !!js Number(process.env.DSH_TAVERN_INTERNAL_PORT || process.env.PORT || 3082)
- id: web-runtime
  config:
    printUrl: false
    surfaceContext: true
    trustedHosts: !!js >-
      [process.env.VERCEL_URL, process.env.VERCEL_PROJECT_PRODUCTION_URL,
      process.env.DSH_PREVIEW_HOST, '127.0.0.1:' + (process.env.PORT || 3082),
      'localhost:' + (process.env.PORT || 3082)].filter(Boolean)
- id: connection
  config:
    trustedHosts: !!js >-
      [process.env.VERCEL_URL, process.env.VERCEL_PROJECT_PRODUCTION_URL,
      process.env.DSH_PREVIEW_HOST, '127.0.0.1:' + (process.env.PORT || 3082),
      'localhost:' + (process.env.PORT || 3082)].filter(Boolean)
- id: agent-default-model
  config:
    provider: dsh-tavern-preview
    model: fixed-preview
- id: llm-deepseek
  disabled: true
- id: llm-pi-ai
  disabled: true
- id: session-title-llm
  disabled: true
- id: web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: subprocess
  disabled: true
- id: sandbox
  disabled: true
- id: bash-sandbox
  disabled: true
- id: pwsh-sandbox
  disabled: true
- id: approval
  disabled: true
- id: permission
  disabled: true
- id: shell-env
  disabled: true
- id: directory-picker
  name: '@deepseek-ai/dsh-host-directory-picker-browse'
- id: plugin-inventory
  disabled: true
- id: ui-settings-models
  disabled: true
- id: ui-settings-plugin-inventory
  disabled: true
- id: agent-presets
  config:
    default: tavern
    includeUserRoot: false
- insert:
    - id: dsh-tavern-preview
      name: dsh-tavern-preview-plugin
      inject:
        - llm
        - workspaceRegistry
        - webServer
        - apiProxy
    - id: dsh-tavern
      name: dsh-tavern-plugin
      inject:
        - fs
        - llm
        - webServer
        - tools
        - agentDefaultModel
        - agentPresets
