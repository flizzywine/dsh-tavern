name: Publish DSH NEXT plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: Unused Tavern plugin SemVer (defaults to package.json)
        type: string

permissions:
  contents: write

concurrency:
  group: publish-next-plugin
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - run: pnpm install --frozen-lockfile
      - name: Publish Git bundle and market index
        env:
          PLUGIN_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          branch=plugin-market-next
          dist="$RUNNER_TEMP/next-plugin"
          index="$RUNNER_TEMP/next-index.json"
          node bin/build-next-plugin.mjs build "$dist" "$PLUGIN_VERSION"
          git -C "$dist" init -q
          git -C "$dist" config user.name 'github-actions[bot]'
          git -C "$dist" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git -C "$dist" fetch --no-tags "$GITHUB_WORKSPACE" "refs/remotes/origin/$branch"
            git -C "$dist" reset --soft FETCH_HEAD
            git -C "$dist" show FETCH_HEAD:index.json > "$index"
          fi
          git -C "$dist" add -f --all
          git -C "$dist" commit -qm "Build Tavern plugin from $(git rev-parse HEAD)"
          commit=$(git -C "$dist" rev-parse HEAD)
          node bin/build-next-plugin.mjs catalog "$index" "$dist/package.json" "$commit"
          mv "$index" "$dist/index.json"
          git -C "$dist" add index.json
          git -C "$dist" commit -qm "List Tavern plugin $commit"
          git fetch --no-tags "$dist" HEAD
          git push origin "FETCH_HEAD:refs/heads/$branch"
