name: Publish DSH NEXT plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: Unused Tavern plugin SemVer (defaults to package.json)
        type: string

permissions:
  contents: write

concurrency:
  group: publish-next-plugin
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - run: pnpm install --frozen-lockfile
      - name: Publish Git bundle and market index
        env:
          PLUGIN_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          branch=plugin-market-next
          download_branch=plugin-next-downloads
          dist="$RUNNER_TEMP/next-plugin"
          downloads="$RUNNER_TEMP/next-downloads"
          index="$RUNNER_TEMP/next-index.json"
          node bin/build-next-plugin.mjs build "$dist" "$PLUGIN_VERSION"
          pnpm --dir "$dist" --config.node-linker=hoisted pack --pack-destination "$RUNNER_TEMP"
          version=$(node -p 'require(process.argv[1]).version' "$dist/package.json")
          git init -q "$downloads"
          if git show-ref --verify --quiet "refs/remotes/origin/$download_branch"; then
            git -C "$downloads" fetch --no-tags "$GITHUB_WORKSPACE" "refs/remotes/origin/$download_branch"
            git -C "$downloads" reset --mixed FETCH_HEAD
          fi
          test "$(wc -c < "$RUNNER_TEMP/dsh-tavern-bundle-$version.tgz")" -lt 20000000
          mv "$RUNNER_TEMP/dsh-tavern-bundle-$version.tgz" "$downloads/dsh-tavern-bundle.tgz"
          git -C "$downloads" add dsh-tavern-bundle.tgz
          launcher=tavern-plugin/packages/dsh-tavern-launcher
          launcher_version=$(node -p 'require("./" + process.argv[1] + "/package.json").version' "$launcher")
          launcher_archive="dsh-tavern-launcher-$launcher_version.tgz"
          if ! git -C "$downloads" cat-file -e ":$launcher_archive"; then
            pnpm --dir "$launcher" pack --pack-destination "$downloads"
            git -C "$downloads" add "$launcher_archive"
          fi
          git -C "$downloads" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "Pack Tavern $version"
          download_commit=$(git -C "$downloads" rev-parse HEAD)
          printf '{"version":"%s","revision":"%s"}\n' "$version" "$download_commit" > "$downloads/next-download.json"
          git -C "$downloads" add next-download.json
          git -C "$downloads" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "List Tavern $version download"
          download_head=$(git -C "$downloads" rev-parse HEAD)
          git -C "$dist" init -q
          git -C "$dist" config user.name 'github-actions[bot]'
          git -C "$dist" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git -C "$dist" fetch --no-tags "$GITHUB_WORKSPACE" "refs/remotes/origin/$branch"
            git -C "$dist" reset --soft FETCH_HEAD
            git -C "$dist" show FETCH_HEAD:index.json > "$index"
          fi
          git -C "$dist" add -f --all
          git -C "$dist" commit -qm "Build Tavern plugin from $(git rev-parse HEAD)"
          commit=$(git -C "$dist" rev-parse HEAD)
          node bin/build-next-plugin.mjs catalog "$index" "$dist/package.json" "$commit"
          mv "$index" "$dist/index.json"
          git -C "$dist" add index.json
          git -C "$dist" commit -qm "List Tavern plugin $commit"
          git fetch --no-tags "$downloads" HEAD
          git fetch --no-tags "$dist" HEAD
          git push --atomic origin "FETCH_HEAD:refs/heads/$branch" "$download_head:refs/heads/$download_branch"
          curl -fsS --retry 2 "https://purge.jsdelivr.net/gh/flizzywine/dsh-tavern@$download_branch/next-download.json" >/dev/null
