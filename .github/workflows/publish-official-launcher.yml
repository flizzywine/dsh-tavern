name: Publish Tavern desktop launcher

on:
  push:
    branches: [main]
    paths:
      - tavern-plugin/packages/dsh-tavern/package.json
      - .github/workflows/publish-official-launcher.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-official-launcher

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Pack and publish the standard DSH bundle
        id: launcher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source=tavern-plugin/packages/dsh-tavern
          version=$(node -p "require('./$source/package.json').version")
          tag="launcher-v$version"
          cdn_tag="launcher-cdn-v$version"
          archive="dsh-tavern-$version.tgz"
          artifact="$RUNNER_TEMP/$archive"

          # Use the immutable release asset when the same version runs again.
          published=false
          if gh release view "$tag" > /dev/null 2>&1; then
            published=true
            gh release download "$tag" --pattern "$archive" --dir "$RUNNER_TEMP"
          else
            package="./$source"
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              mkdir "$RUNNER_TEMP/launcher-source"
              git archive "refs/tags/$tag" -- "$source" | tar -x -C "$RUNNER_TEMP/launcher-source"
              package="$RUNNER_TEMP/launcher-source/$source"
            fi
            npm pack "$package" --ignore-scripts --silent --pack-destination "$RUNNER_TEMP"
          fi
          node .github/scripts/check-runtime-archive.mjs "$artifact"

          cdn_published=false
          if git show-ref --verify --quiet "refs/tags/$cdn_tag"; then
            cdn_published=true
            if ! git show "refs/tags/$cdn_tag:$archive" | cmp -s "$artifact" -; then
              echo "::error::The versioned launcher release and CDN tag disagree for $archive."
              exit 1
            fi
          fi

          if [[ "$published" == false ]]; then
            gh release create "$tag" "$artifact" --target "$GITHUB_SHA" --latest=false \
              --title "dsh-tavern $version" --notes 'Shared launcher for DeepSeek Harness and DSH NEXT on Windows and macOS. Install it into the original desktop profile, then use Settings → Tavern Launcher to install Tavern.'
          fi

          if [[ "$cdn_published" == false ]]; then
            dist="$RUNNER_TEMP/official-launcher"
            git worktree add --detach "$dist"
            git -C "$dist" checkout --orphan "$cdn_tag"
            git -C "$dist" rm -rfq .
            cp "$artifact" "$dist/$archive"
            git -C "$dist" add "$archive"
            git -C "$dist" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "Publish $archive"
            git -C "$dist" push origin "HEAD:refs/tags/$cdn_tag"
          fi

          printf 'archive=%s\nversion=%s\n' "$artifact" "$version" >> "$GITHUB_OUTPUT"

      - name: Publish the stable market download
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LAUNCHER_ARCHIVE: ${{ steps.launcher.outputs.archive }}
          LAUNCHER_VERSION: ${{ steps.launcher.outputs.version }}
        run: |
          set -euo pipefail
          # An older run can be rerun after a new launcher has shipped.
          git fetch origin main
          main_version=$(git show FETCH_HEAD:tavern-plugin/packages/dsh-tavern/package.json | jq -r .version)
          if [[ "$main_version" != "$LAUNCHER_VERSION" ]]; then
            echo "Skipping the market download for $LAUNCHER_VERSION. Main is at $main_version."
            exit 0
          fi

          tag=launcher-current
          asset=dsh-tavern.tgz
          label="dsh-tavern $LAUNCHER_VERSION"
          digest="sha256:$(sha256sum "$LAUNCHER_ARCHIVE" | cut -d' ' -f1)"
          if ! release_id=$(gh release view "$tag" --json databaseId --jq .databaseId); then
            cp "$LAUNCHER_ARCHIVE" "$RUNNER_TEMP/$asset"
            gh release create "$tag" "$RUNNER_TEMP/$asset#$label" --target "$GITHUB_SHA" --latest=false \
              --title 'DSH Tavern launcher for the plugin market' \
              --notes 'This release provides a stable download URL for the current desktop launcher. Versioned launcher releases are available separately.'
            release_id=$(gh release view "$tag" --json databaseId --jq .databaseId)
          fi

          release_assets="repos/$GITHUB_REPOSITORY/releases/$release_id/assets"
          asset_api="repos/$GITHUB_REPOSITORY/releases/assets"
          assets=$(gh api "$release_assets" --paginate --slurp | jq 'add')
          if jq -e --arg name "$asset" --arg digest "$digest" \
              'any(.[]; .name == $name and .digest == $digest and .state == "uploaded")' <<< "$assets" >/dev/null; then
            exit 0
          fi

          # Upload and verify the replacement before moving the public asset.
          candidate="candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tgz"
          cp "$LAUNCHER_ARCHIVE" "$RUNNER_TEMP/$candidate"
          gh release upload "$tag" "$RUNNER_TEMP/$candidate#$label"
          candidate_id=$(gh api "$release_assets" --paginate --slurp | jq -er --arg name "$candidate" --arg digest "$digest" \
            'add | .[] | select(.name == $name and .digest == $digest and .state == "uploaded") | .id')
          previous_id=$(jq -r --arg name "$asset" '.[] | select(.name == $name) | .id' <<< "$assets")
          if [[ -n "$previous_id" ]]; then
            trap 'gh api --method PATCH "$asset_api/$previous_id" -f name="$asset" --silent || true' EXIT
            gh api --method PATCH "$asset_api/$previous_id" -f name="previous-$previous_id.tgz" --silent
          fi
          gh api --method PATCH "$asset_api/$candidate_id" -f name="$asset" --silent
          [[ $(gh api "$asset_api/$candidate_id" --jq .name) == "$asset" ]]
          trap - EXIT
          if [[ -n "$previous_id" ]]; then
            gh api --method DELETE "$asset_api/$previous_id" --silent
          fi
