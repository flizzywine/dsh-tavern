name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'examples/manual-demo/**'
      - 'tests/*site.test.mjs'
      - 'tests/manual-pages.test.mjs'
      - 'README.md'
      - 'bin/dsh-compatibility.mjs'
      - 'config/dsh-compatibility.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify documentation
        run: |
          node docs/manual/build.mjs
          node --test tests/manual-site.test.mjs tests/product-site.test.mjs tests/manual-pages.test.mjs
      - name: Prepare public files only
        run: node docs/manual/package.mjs "$RUNNER_TEMP/tavern-pages"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/tavern-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
