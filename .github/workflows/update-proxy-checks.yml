name: Update proxy checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-proxy-checks.yml'
      - 'android/native/shims/source-update.mjs'
      - 'android/setup.sh'
      - 'bin/application-update.mjs'
      - 'bin/download.cjs'
      - 'bin/relocate-pnpm-install.mjs'
      - 'install.ps1'
      - 'install.sh'
      - 'bin/system-proxy.mjs'
      - 'bin/launcher-environment.mjs'
      - 'bin/service-lifecycle.mjs'
      - 'tavern-plugin/lib/application-updater.js'
      - 'tavern-plugin/packages/dsh-tavern/lib/installer-download.mjs'
      - 'tavern-plugin/packages/dsh-tavern/lib/proxy-environment.mjs'
      - 'tavern-plugin/packages/dsh-tavern/lib/worker.mjs'
      - 'tests/application-update-proxy.test.mjs'
      - 'tests/cdn-upgrade.test.mjs'
      - 'tests/download.test.mjs'
      - 'tests/staged-app-install.test.mjs'
      - 'tests/profile-bridge-download.test.mjs'
      - 'tests/system-proxy*.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    paths:
      - '.github/workflows/update-proxy-checks.yml'
      - 'android/native/shims/source-update.mjs'
      - 'android/setup.sh'
      - 'bin/application-update.mjs'
      - 'bin/download.cjs'
      - 'bin/relocate-pnpm-install.mjs'
      - 'install.ps1'
      - 'install.sh'
      - 'bin/system-proxy.mjs'
      - 'bin/launcher-environment.mjs'
      - 'bin/service-lifecycle.mjs'
      - 'tavern-plugin/lib/application-updater.js'
      - 'tavern-plugin/packages/dsh-tavern/lib/installer-download.mjs'
      - 'tavern-plugin/packages/dsh-tavern/lib/proxy-environment.mjs'
      - 'tavern-plugin/packages/dsh-tavern/lib/worker.mjs'
      - 'tests/application-update-proxy.test.mjs'
      - 'tests/cdn-upgrade.test.mjs'
      - 'tests/download.test.mjs'
      - 'tests/staged-app-install.test.mjs'
      - 'tests/profile-bridge-download.test.mjs'
      - 'tests/system-proxy*.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  update-proxy:
    name: Update proxy / ${{ matrix.os }} / Node 24.12.0
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-22.04, macos-15]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check launcher downloads and updater proxy inheritance
        run: node --test tests/system-proxy.test.mjs tests/system-proxy-inheritance.test.mjs tests/application-update-proxy.test.mjs tests/profile-bridge-download.test.mjs
      - name: Check runtime downloads and staged updates
        run: node --test tests/download.test.mjs tests/staged-app-install.test.mjs tests/cdn-upgrade.test.mjs
      - name: Check Android source updates
        if: runner.os == 'Linux'
        run: node --test tests/android-native-source-update.test.mjs tests/android-setup-download.test.mjs
