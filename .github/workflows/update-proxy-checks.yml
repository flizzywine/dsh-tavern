name: Update proxy checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-proxy-checks.yml'
      - 'bin/application-update.mjs'
      - 'bin/system-proxy.mjs'
      - 'bin/launcher-environment.mjs'
      - 'bin/service-lifecycle.mjs'
      - 'tavern-plugin/lib/application-updater.js'
      - 'tests/application-update-proxy.test.mjs'
      - 'tests/system-proxy*.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    paths:
      - '.github/workflows/update-proxy-checks.yml'
      - 'bin/application-update.mjs'
      - 'bin/system-proxy.mjs'
      - 'bin/launcher-environment.mjs'
      - 'bin/service-lifecycle.mjs'
      - 'tavern-plugin/lib/application-updater.js'
      - 'tests/application-update-proxy.test.mjs'
      - 'tests/system-proxy*.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  update-proxy:
    name: Update proxy / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            node: 24.12.0
          - os: ubuntu-22.04
            node: 22.19.0
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check updater proxy inheritance without external network requests
        run: node --test tests/system-proxy.test.mjs tests/system-proxy-inheritance.test.mjs tests/application-update-proxy.test.mjs
