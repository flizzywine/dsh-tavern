# 独立酒馆 Profile：端口由 CLI 或 Desktop 宿主管理。
- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('profile-data', 'tavern', 'sessions')
- id: storage-json
  config:
    root: !!js dshHomePath('profile-data', 'tavern', 'storages')
- id: bash-sandbox
  config:
    timeoutMs: 600000
    maxTimeoutMs: 600000
- id: pwsh-sandbox
  config:
    timeoutMs: 600000
    maxTimeoutMs: 600000
- id: agent-presets
  config:
    default: tavern
    includeUserRoot: false
- insert:
    - id: dsh-tavern
      name: dsh-tavern-plugin
      inject:
        - fs
        - llm
        - webServer
        - tools
        - agentDefaultModel
        - sandboxPolicy
        - shell
        - agentPresets
