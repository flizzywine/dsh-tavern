# 独立酒馆 profile：使用 3081，启动后直接显示酒馆整页界面。
- id: webserver
  config:
    host: 127.0.0.1
    port: 3081
- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('profile-data', 'tavern', 'sessions')
- id: storage-json
  config:
    root: !!js dshHomePath('profile-data', 'tavern', 'storages')
- id: bash-sandbox
  config:
    timeoutMs: 600000
    maxTimeoutMs: 600000
- id: pwsh-sandbox
  config:
    timeoutMs: 600000
    maxTimeoutMs: 600000
- id: agent-presets
  config:
    default: tavern
    includeUserRoot: false
- insert:
    - id: dsh-tavern
      name: dsh-tavern-plugin
      inject:
        - fs
        - llm
        - webServer
        - tools
        - agentDefaultModel
        - sandboxPolicy
        - shell
        - agentPresets
