# Tavern preset：最终系统提示词由插件按游玩／卡片会话装配。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: ''
    includeRuntimeContext: false

# 卡片模式复用 dsh-base 提供的一次性 bash／pwsh 与文件编辑能力；
# 具体工具是否对当前会话可见，由 Tavern 按游玩/卡片模式过滤。
- id: filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

    - id: str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000

# 卡片工作台复用 DSH 原生 Skill 目录和按需加载工具。
# 只扫描 Tavern 自己的内置目录与用户数据目录，不暴露全局 DSH Skills；
# 是否对模型可见，仍由 Tavern 按当前会话模式过滤。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('../../data/skills/', baseUrl))"
    bundledSkillDir: !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# 复用 DSH 原生上下文压缩能力，并恢复 /compact 命令。
# 压缩器与工具结果裁剪器共享同一隔离域，保持与 DSH 标准模式一致。
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
