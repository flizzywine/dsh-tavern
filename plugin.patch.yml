# Generated by node bin/build-plugin-package.mjs; do not edit directly.
- insert:
    - id: tavern-package-guard
      name: ./bin/plugin-package-guard.mjs
- insert:
    - id: better-sidebar
      name: ./tavern-plugin/packages/dsh-better-sidebar/lib/index.js
# dsh-dream-skin profile patch layer — insert one loader entry for the plugin
# package. The entry is a normal cordis loader entry (id + package name); the
# browser half is picked up by dsh-client-modules through the package's
# dsh.client declaration, exactly like the shipped ui-* packages.
- insert:
    - id: dream-skin
      name: ./tavern-plugin/packages/dsh-dream-skin/lib/index.js

# dsh-tavern-plugin bundle：项目管理配置随版本升级；Profile patch 只保留用户覆盖。
# Tavern 默认完全权限；保留原生权限预设，用户仍可主动切回受限模式。
- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()
- id: approval
  config:
    policy: never
- id: permission
  config:
    defaultPreset: danger-full-access
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('profile-data', 'tavern', 'sessions')
- id: storage-json
  config:
    root: !!js dshHomePath('profile-data', 'tavern', 'storages')
- id: bash-sandbox
  config:
    timeoutMs: 600000
    maxTimeoutMs: 600000
- id: pwsh-sandbox
  config:
    timeoutMs: 600000
    maxTimeoutMs: 600000
# dsh-web-app disables command and filesystem tools for its generic web
# profile. Tavern's card workspace is an explicitly writable Agent surface,
# so restore the cross-platform primitives here instead of replacing them
# with task-specific RPCs.
- id: tool-bash
  disabled: !!js process.platform === 'win32'
- id: tool-pwsh
  disabled: !!js process.platform !== 'win32'
- id: tool-fs
  disabled: false
- id: agent-presets
  config:
    default: tavern
    includeUserRoot: false
- id: tool-web
  disabled: false
  config:
    search: true
    fetch: false
- insert:
    - id: tavern-cordis-inspect
      name: ./tavern-plugin/lib/cordis-inspect.js
    - id: dsh-tavern
      name: ./tavern-plugin/lib/index.js
      inject:
        - fs
        - llm
        - webServer
        - tools
        - skills
        - agentDefaultModel
        - sandboxPolicy
        - shell
        - agentPresets
        - settings
        - tokenMeter

- insert:
    - id: dsh-tavern-remote
      name: ./tavern-plugin/packages/dsh-tavern-remote/lib/index.js
